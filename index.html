<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTA Transit Status Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .header {
      max-width: 800px;
      margin: 0 auto 2rem auto;
    }
    .header h1 {
      margin: 0 0 0.5rem 0;
    }
    .header p {
      color: var(--text-muted);
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      border-left: 6px solid #64748b;
    }
    .line-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .status {
      font-size: 0.95rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>CTA Service Status</h1>
    <p id="updated">Loading latest status...</p>
  </div>

  <div class="grid" id="status-grid"></div>

  <script>
    // Update this URL to point to your new alerts.json file on GitHub
    const DATA_URL = "https://raw.githubusercontent.com/pravinboniface/cta/main/alerts.json";

    async function loadStatus() {
      try {
        const res = await fetch(DATA_URL);
        const data = await res.json();
        
        const grid = document.getElementById("status-grid");
        const updatedEl = document.getElementById("updated");

        grid.innerHTML = "";

        // Ensure data is a valid non-empty array
        if (Array.isArray(data) && data.length > 0) {
          // Grab the timestamp from the first record
          updatedEl.textContent = `Last updated: ${data[0].TimeStamp}`;

          data.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            
            // Apply dynamic border color directly from the XML's RouteColorCode element
            if (item.RouteColorCode) {
              card.style.borderLeftColor = `#${item.RouteColorCode}`;
            }

            card.innerHTML = `
              <div class="line-title">${item.Route || "Unknown Route"}</div>
              <div class="status">${item.RouteStatus || "Normal Service"}</div>
            `;
            grid.appendChild(card);
          });
        } else {
          updatedEl.textContent = "No status data available.";
        }

      } catch (err) {
        document.getElementById("updated").textContent = "Error loading status data.";
        console.error(err);
      }
    }

    loadStatus();
  </script>
</body>
</html>
